<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Numeral Fonts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Bodoni+Moda:wght@900&family=Abril+Fatface&family=Cinzel+Decorative:wght@900&family=DM+Serif+Display:ital@1&family=Lobster&family=UnifrakturMaguntia&family=Rozha+One&family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1126;--card:#2c5a50;--gold:#f0b04a;--ink:#f6efe0;--muted:#b9c1d6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Serif TC',serif;padding:calc(env(safe-area-inset-top) + 28px) 16px 40px}
  h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;color:#f1d89b;font-size:30px;text-align:center}
  p.lead{color:var(--muted);font-size:13px;text-align:center;margin:8px 0 22px;line-height:1.7}
  .opt{background:repeating-linear-gradient(180deg,#2f5f54 0 7px,#24493f 7px 9px);border-radius:10px;padding:14px 14px 12px;margin:0 auto 14px;max-width:520px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#dfe8e2;margin-bottom:6px}
  .head b{font-size:15px;color:#fff;margin-right:8px}
  .head a{color:#f1d89b;text-decoration:none;border:1px solid rgba(241,216,155,.5);border-radius:999px;padding:3px 10px;font-size:12px}
  .nums{display:flex;justify-content:space-between;font-size:clamp(40px,11vw,60px);line-height:1.15;color:var(--gold);
    -webkit-text-stroke:2px #1a0d05;paint-order:stroke fill;text-shadow:0 2px 6px rgba(0,0,0,.35)}
</style>
</head>
<body>
<h1>Numeral options</h1>
<p class="lead">开窗后出现的数字字体。挑一个告诉我字母就好。<br>点“在房子里看看”可以在预览里直接看效果。</p>
<div id="list"></div>
<script>
const F = [
  ['A','Playfair Display · 粗斜体','"Playfair Display"','italic 900'],
  ['B','Bodoni Moda · 古典粗体','"Bodoni Moda"','900'],
  ['C','Abril Fatface · 粗对比衬线','"Abril Fatface"','400'],
  ['D','Cinzel Decorative · 罗马刻字','"Cinzel Decorative"','900'],
  ['E','DM Serif Display · 优雅斜体','"DM Serif Display"','italic 400'],
  ['F','Lobster · 圆润手写','"Lobster"','400'],
  ['G','UnifrakturMaguntia · 哥特','"UnifrakturMaguntia"','400'],
  ['H','Rozha One · 厚重衬线','"Rozha One"','400'],
];
document.getElementById('list').innerHTML = F.map(([k,label,fam,st]) => `
  <div class="opt"><div class="head"><span><b>${k}</b>${label}</span><a href="./?preview&font=${k}">在房子里看看</a></div>
  <div class="nums" style="font-family:${fam};font:${st} clamp(40px,11vw,60px)/1.15 ${fam}">${[1,2,3,4,5,6,7].map(n=>`<span>${n}</span>`).join('')}</div></div>`).join('');
</script>
</body>
</html>
