<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Winter Windows</title>
<meta name="theme-color" content="#0b1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --n:1;--sky-top:#070c24;--sky-bot:#1b2a58;--mtn:#1a2650;--mtn2:#1a2450;--city:#121b3d;--c101:#1c2548;
  --hill:#8f9cc4;--hill2:#a7b2d3;--pathc:#7480a8;--facade:#b8bfd4;--roof:#8e95ad;--trim:#a7aec4;--line:#6c6f86;
  --shutter:#c4cadc;--snow:#c9d1ea;--tree:#22355a;--tree2:#3a4a70;--cloud:#3a4675;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 78%);
  background-color:var(--sky-top);
  font-family:'Cormorant Garamond','Noto Serif TC',Georgia,serif;color:#fff;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;
}
canvas,#scene,#sky,#hang{position:fixed;inset:0;width:100%;height:100%}
#stars{z-index:1}
#sky{z-index:2;pointer-events:none;overflow:hidden}
#hang{z-index:4;pointer-events:none}
#scene{z-index:6;height:100dvh}
#snow{z-index:7;pointer-events:none}

/* sun & moon */
#sun,#moon{position:absolute;transform:translate(-50%,-50%);transition:opacity .8s}
#sun{width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle,#fffdf2 0 40%,#ffeab0 52%,rgba(255,222,150,.45) 64%,rgba(255,222,150,0) 72%);
  box-shadow:0 0 70px 34px rgba(255,226,165,.33)}
#moon{width:50px;height:50px;filter:drop-shadow(0 0 18px rgba(220,230,255,.55)) drop-shadow(0 3px 3px rgba(0,0,30,.4))}
.cloud{position:absolute;width:150px;opacity:.9;filter:drop-shadow(0 3px 4px rgba(10,16,48,.25))}
.cloud path{fill:var(--cloud)}
.cloud.c1{top:9%;animation:drift 140s linear infinite}
.cloud.c2{top:20%;width:110px;animation:drift 190s linear infinite -70s}
.cloud.c3{top:31%;width:170px;animation:drift 230s linear infinite -160s}
@keyframes drift{from{left:-30%}to{left:110%}}

/* hanging paper snowflakes */
.hangitem{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:sway 6s ease-in-out infinite alternate}
.hangitem .str{width:1px;background:rgba(255,255,255,.55)}
.hangitem svg{filter:drop-shadow(0 3px 3px rgba(0,0,30,.35));margin-top:-2px}
@keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}

#title{position:fixed;z-index:5;left:0;right:0;top:calc(env(safe-area-inset-top) + 4.2vh);text-align:center;pointer-events:none;
  text-shadow:0 1px 8px rgba(5,10,40,.45)}
#title .sub{font-size:12px;letter-spacing:.42em;font-weight:600;opacity:.92;padding-left:.42em}
#title h1{font-style:italic;font-weight:600;font-size:clamp(34px,10vw,48px);line-height:1.05;color:#ecd08c;letter-spacing:.01em;margin-top:2px}

#status{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 3.2vh);
  font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:.08em;white-space:nowrap;
  padding:8px 16px;border-radius:999px;background:rgba(14,20,52,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(236,208,140,.35);color:#f6ecd2}
#toast{position:fixed;z-index:9;left:50%;bottom:calc(env(safe-area-inset-bottom) + 3.2vh + 46px);transform:translate(-50%,10px);
  font-family:'Noto Serif TC',serif;font-size:13px;padding:8px 14px;border-radius:6px;background:#fbf6ea;color:#3a2e22;
  box-shadow:0 6px 18px rgba(0,0,30,.3);opacity:0;transition:.35s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* scene svg classes */
.mtn{fill:var(--mtn)}.mtn2{fill:var(--mtn2)}.city{fill:var(--city)}.c101{fill:var(--c101)}
.hill{fill:var(--hill)}.hill2{fill:var(--hill2)}.pathc{fill:var(--pathc)}
.tree{fill:var(--tree)}.tree2{fill:var(--tree2)}.tsnow{stroke:var(--snow);stroke-width:2.2;stroke-linecap:round;fill:none;opacity:.9}
.fac{fill:var(--facade)}.roof{fill:var(--roof)}.trim{fill:var(--trim)}.snowc{fill:var(--snow)}
.ln{stroke:var(--line);fill:none;stroke-width:.6}.lnf{fill:var(--line)}
.clight{opacity:var(--n)}
.dlight{opacity:calc(.12 + var(--n)*.88)}
.lampglow{opacity:var(--n)}

/* windows */
.win{cursor:pointer}
.halo{fill:#ffc86a;opacity:calc(var(--n)*.35)}
.win.ready .halo{opacity:calc(var(--n)*.55 + .28)}
.win.open .halo{opacity:calc(var(--n)*.95 + .12)}
.shut{fill:var(--shutter);stroke:var(--line);stroke-width:.5}
.pnl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.55}
.shade{fill:#2a1c20;opacity:0;transition:opacity 1.2s .35s}
.win.open .shade{opacity:.2}
.sh{transform-box:fill-box;transition:transform 1.25s cubic-bezier(.55,.05,.25,1) .4s}
.sh.L{transform-origin:0% 50%}.sh.R{transform-origin:100% 50%}
.win.open .sh{transform:scaleX(-.9)}
.win.door.open .sh{transform:scaleX(-.62)}
.strip{transition:opacity .35s}
.win.open .strip{opacity:0}
.bow,.tag{transform-box:fill-box;transform-origin:50% 50%;transition:transform .75s cubic-bezier(.5,0,.85,.45),opacity .6s .12s}
.win.open .bow{transform:translateY(46px) rotate(38deg);opacity:0}
.win.open .tag{transform:translateY(52px) rotate(-32deg);opacity:0}
.win.ready .bow{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.gift{opacity:0;transition:opacity .7s 1.1s}
.win.open .gift{opacity:1}
.win.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.instant *{transition:none!important}

/* card */
#modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(8,12,34,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .4s}
#modal.on{opacity:1;pointer-events:auto}
.card{position:relative;width:min(340px,100%);max-height:82vh;overflow:auto;background:#fbf7ee;color:#2d2620;border-radius:3px;
  padding:34px 26px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,20,.45);transform:translateY(16px) scale(.96);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#modal.on .card{transform:none}
.card::before{content:"";position:absolute;inset:8px;border:1px solid #d9bf82;pointer-events:none}
.card .bowtop{position:absolute;top:-16px;left:50%;transform:translateX(-50%)}
.card .meta{font-size:12px;letter-spacing:.32em;color:#a3874c;font-weight:600}
.card h2{font-family:'Noto Serif TC',serif;font-weight:600;font-size:22px;margin:10px 0 12px;letter-spacing:.04em}
.card p{font-family:'Noto Serif TC',serif;font-size:15px;line-height:1.85;color:#4a3f34;white-space:pre-line}
.card img{width:100%;border-radius:2px;margin:6px 0 12px;display:block}
.card button{margin-top:20px;font-family:'Noto Serif TC',serif;font-size:14px;letter-spacing:.2em;padding:9px 26px;border:1px solid #2d2620;background:none;color:#2d2620;border-radius:999px;cursor:pointer}

/* preview tools */
#preview{position:fixed;z-index:9;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);display:none;align-items:center;gap:10px;
  font:12px -apple-system,system-ui,sans-serif;background:rgba(10,14,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:7px 10px;border-radius:10px}
#preview.on{display:flex}
#preview input{flex:1;accent-color:#ecd08c}
#preview button{font:inherit;color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:6px;padding:5px 8px}
body.has-preview #title{top:calc(env(safe-area-inset-top) + 52px)}
@media (prefers-reduced-motion:reduce){.hangitem,.cloud,.win.ready .bow{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="flake" viewBox="-50 -50 100 100"><g id="flakeArms" stroke="#fdfdfd" stroke-width="5" stroke-linecap="round" fill="none"></g><circle r="7" fill="#fdfdfd"/></symbol></defs></svg>

<canvas id="stars"></canvas>
<div id="sky">
  <div id="sun"></div>
  <svg id="moon" viewBox="0 0 50 50"><defs><mask id="cres"><rect width="50" height="50" fill="#fff"/><circle cx="35" cy="17" r="20" fill="#000"/></mask></defs><circle cx="25" cy="25" r="22" fill="#f4f5fa" mask="url(#cres)"/></svg>
  <svg class="cloud c1" viewBox="0 0 140 70"><path d="M18 62Q4 62 6 50Q8 38 24 39Q24 22 44 22Q56 8 74 19Q90 10 100 28Q120 25 122 43Q136 45 133 57Q130 63 118 63Z"/></svg>
  <svg class="cloud c2" viewBox="0 0 140 70"><path d="M18 62Q4 62 6 50Q8 38 24 39Q24 22 44 22Q56 8 74 19Q90 10 100 28Q120 25 122 43Q136 45 133 57Q130 63 118 63Z"/></svg>
  <svg class="cloud c3" viewBox="0 0 140 70"><path d="M18 62Q4 62 6 50Q8 38 24 39Q24 22 44 22Q56 8 74 19Q90 10 100 28Q120 25 122 43Q136 45 133 57Q130 63 118 63Z"/></svg>
</div>
<div id="hang"></div>
<div id="title"><div class="sub">DEC 25 — JAN 1</div><h1>Winter Windows</h1></div>

<svg id="scene" viewBox="0 0 400 860" preserveAspectRatio="xMidYMax meet"></svg>
<canvas id="snow"></canvas>

<div id="status"></div>
<div id="toast"></div>
<div id="preview"><span id="hlabel">--:--</span><input id="hslider" type="range" min="0" max="24" step="0.05"><button id="reset">重置</button></div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
/* =========================================================
   ✏️ 在这里改内容：每天一扇窗（第1天 = 12/25，第8天 = 1/1）
   img 可以放图片网址或同仓库里的文件名，例如 'photo1.jpg'
   ========================================================= */
const CONTENT = [
  { title: '圣诞快乐',   text: '第一扇窗。\n愿你今天被很多很多温柔包围。' },
  { title: '一杯热可可', text: '今天允许自己什么都不做，\n只是窝着。' },
  { title: '一首歌',     text: '（在这里放一首想让 TA 听的歌）' },
  { title: '一段回忆',   text: '（写一件你们一起经历过、\n想起来就会笑的事）' },
  { title: '一个小任务', text: '出门走一圈，\n拍一张今天的天空发给我。' },
  { title: '一张照片',   text: '（在这里放一张照片）' },
  { title: '跨年前夜',   text: '今年辛苦啦。\n谢谢你出现在这一年里。' },
  { title: '新年快乐',   text: '2027，\n我们也要一起。' },
];
const PLAQUE = '✦';            // 中间小牌子上的字，可以换成名字缩写
const YEAR = 2026;              // 12/25 所在的年份

/* ---------- setup ---------- */
const Q = new URLSearchParams(location.search);
const PREVIEW = Q.has('preview');
const HOUR_OVERRIDE = Q.has('hour') ? parseFloat(Q.get('hour')) : null;
const dayDate = d => new Date(YEAR, 11, 24 + d);
const isUnlocked = d => PREVIEW || new Date() >= dayDate(d);
const fmt = dt => `${dt.getMonth()+1}月${dt.getDate()}日`;
const KEY = PREVIEW ? 'ww-preview-v1' : 'ww-opened-v1';
let opened = new Set();
try { opened = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch(e) {}
const saveOpened = () => { try { localStorage.setItem(KEY, JSON.stringify([...opened])); } catch(e) {} };

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- paper snowflake symbol ---------- */
(() => {
  let s = '';
  for (let i = 0; i < 6; i++) {
    s += `<g transform="rotate(${i*60})"><line y2="-44"/><polyline points="-11,-28 0,-18 11,-28"/><polyline points="-8,-40 0,-32 8,-40"/></g>`;
  }
  document.getElementById('flakeArms').innerHTML = s;
  const hang = document.getElementById('hang');
  [[6,70,30,5.5],[19,128,22,7],[82,96,34,6.2],[94,36,20,5]].forEach(([l,len,sz,dur],i)=>{
    const d = document.createElement('div'); d.className='hangitem';
    d.style.left = `calc(${l}% - ${sz/2}px)`; d.style.animationDuration = dur+'s'; d.style.animationDelay = (-i*1.7)+'s';
    d.innerHTML = `<div class="str" style="height:${len}px"></div><svg width="${sz}" height="${sz}"><use href="#flake"/></svg>`;
    hang.appendChild(d);
  });
})();

/* ---------- scene ---------- */
const LAYOUT = { // day: [cx, y, w, h]
  1:[265,322,34,62], 2:[265,418,34,68], 3:[135,322,34,62], 4:[270,542,34,76],
  5:[135,418,34,68], 6:[200,322,34,62], 7:[130,542,34,76], 8:[200,566,48,124],
};

function pine(x, b, h, cls, wf = .36) {
  const w = h * wf, tiers = [[1,.55,.55],[.72,.3,.78],[.46,.08,1]];
  let out = `<rect class="${cls}" x="${x-2.5}" y="${b-h*.12}" width="5" height="${h*.12}"/>`;
  tiers.forEach(([t,bt,hwf]) => {
    const top = b - h*t, bot = b - h*bt, hw = w*hwf;
    let d = `M${x} ${top}L${x-hw} ${bot}`;
    for (let k = 1; k <= 10; k++) d += `L${(x-hw + 2*hw*k/10).toFixed(1)} ${bot - (k%2 ? 4 : 0)}`;
    out += `<path class="${cls}" d="${d}Z"/><path class="tsnow" d="M${x} ${top+2}L${x-hw*.55} ${top+(bot-top)*.55}"/>`;
  });
  return out;
}

function taipei101(cx, base) {
  let p = `M${cx-20} ${base}L${cx-17} ${base-90}L${cx+17} ${base-90}L${cx+20} ${base}Z`;
  let y = base - 90, lights = '';
  p += `M${cx-19} ${y}h38v-8h-38Z`; y -= 8;
  for (let i = 0; i < 8; i++) {
    p += `M${cx-13} ${y}L${cx-17.5} ${y-40}L${cx+17.5} ${y-40}L${cx+13} ${y}Z`;
    lights += `<rect x="${cx-16}" y="${y-41.5}" width="32" height="1.2" fill="#fff1c8"/>`;
    for (let r = 0; r < 4; r++) lights += `<rect x="${cx-11+r*0.6}" y="${y-32+r*8}" width="${22-r*1.2}" height="1.2" fill="#ffd98c" fill-opacity="${.35+.15*(r%2)}"/>`;
    y -= 40; p += `M${cx-18} ${y}h36v-2.5h-36Z`; y -= 2.5;
  }
  p += `M${cx-10} ${y}L${cx-8} ${y-30}L${cx+8} ${y-30}L${cx+10} ${y}Z`; y -= 30;
  p += `M${cx-6} ${y}h12v-10h-12Z`; y -= 10;
  p += `M${cx-3.5} ${y}h7v-8h-7Z`; y -= 8;
  p += `M${cx-1.3} ${y}L${cx-.4} ${y-40}L${cx+.4} ${y-40}L${cx+1.3} ${y}Z`;
  lights += `<circle cx="${cx}" cy="${y-40}" r="1.6" fill="#ff6b5a"/>`;
  return `<path class="c101" d="${p}"/><g class="clight">${lights}</g>`;
}

function shutter(side, x, y, w, h) {
  const i = 2.6;
  return `<g class="sh ${side}"><rect class="shut" x="${x}" y="${y}" width="${w}" height="${h}"/>
    <rect class="pnl" x="${x+i}" y="${y+i}" width="${w-2*i}" height="${h*.4-i}"/>
    <rect class="pnl" x="${x+i}" y="${y+h*.4+i}" width="${w-2*i}" height="${h*.6-2*i}"/>
    <rect class="shade" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
}

function bowShape() {
  return `<path d="M0 0C-4 -10 -15 -9 -13 0C-15 9 -4 10 0 0Z" fill="#121214"/>
    <path d="M0 0C4 -10 15 -9 13 0C15 9 4 10 0 0Z" fill="#121214"/>
    <path d="M-7 -3C-6 -6 -10 -6 -10 -2" stroke="#3b3b42" stroke-width=".9" fill="none"/>
    <path d="M-1 1L-7 15L-4 14.5L-2.6 16.5L1 3Z" fill="#18181b"/>
    <path d="M1 1L6 15L3.2 14.3L2 16.5L-1 3Z" fill="#18181b"/>
    <ellipse rx="2.8" ry="3.2" fill="#2a2a30"/>`;
}

function giftBox(cx, by, s) {
  return `<g transform="translate(${cx} ${by}) scale(${s})">
    <ellipse cx="0" cy="1" rx="13" ry="2" fill="#7a4210" opacity=".35"/>
    <rect x="-9" y="-14" width="18" height="14" fill="#1b2238"/>
    <rect x="-10" y="-17" width="20" height="4" fill="#232c48"/>
    <rect x="-1.2" y="-17" width="2.4" height="17" fill="#e2c07a"/>
    <path d="M0 -17C-3 -23 -8 -22 -6 -18Z M0 -17C3 -23 8 -22 6 -18Z" fill="#e2c07a"/>
  </g>
  <path d="M${cx+9*s} ${by-24*s}l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#fff6dc"/>`;
}

function windowSVG(d) {
  const [cx, y, w, h] = LAYOUT[d], x = cx - w/2, hw = w/2, door = d === 8, ground = y > 500;
  const s = w / 34, by = y + h * (door ? .46 : .55);
  let top = '';
  if (ground) {
    const r = hw + 3;
    top = `<path class="trim" d="M${x-3} ${y}A${r} ${r} 0 0 1 ${x+w+3} ${y}Z"/>
      <path fill="url(#warm)" d="M${x} ${y-.5}A${hw} ${hw} 0 0 1 ${x+w} ${y-.5}Z" class="dlight"/>
      <path class="ln" d="M${cx} ${y}V${y-hw} M${x+hw*.3} ${y-hw*.7}L${cx} ${y} M${x+w-hw*.3} ${y-hw*.7}L${cx} ${y}"/>`;
  } else {
    top = `<rect class="trim" x="${x-6}" y="${y-9}" width="${w+12}" height="4"/>`;
  }
  const sill = `<rect class="trim" x="${x-5}" y="${y+h+3}" width="${w+10}" height="3"/><rect class="snowc" x="${x-5}" y="${y+h+1.5}" width="${w+10}" height="2" rx="1"/>`;
  return `<g class="win${door ? ' door' : ''}" id="w${d}" data-d="${d}">
    <rect class="halo" x="${x-7}" y="${y-7}" width="${w+14}" height="${h+14}" filter="url(#blur)"/>
    ${top}
    <rect class="trim" x="${x-3}" y="${y-3}" width="${w+6}" height="${h+6}"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#warm)"/>
    <rect x="${x}" y="${y+h*.72}" width="${w}" height="1.4" fill="#b8742c" opacity=".5"/>
    <g class="gift">${giftBox(cx, y + h*.72, door ? 1.25 : .95)}</g>
    ${shutter('L', x, y, hw, h)}${shutter('R', cx, y, hw, h)}
    <g class="rib">
      <rect class="strip" x="${cx-1.6}" y="${y}" width="3.2" height="${h}" fill="#141416"/>
      <rect class="strip" x="${x}" y="${by-1.6}" width="${w}" height="3.2" fill="#141416"/>
      <g class="bow"><g transform="translate(${cx} ${by}) scale(${s})">${bowShape()}</g></g>
      <g class="tag"><g transform="translate(${cx} ${y + h*(door ? .2 : .24)})">
        <circle r="7.4" fill="#fbf7ee" stroke="#141416" stroke-width=".8"/>
        <text y="3.4" text-anchor="middle" font-size="10" font-weight="600" fill="#2b2622" font-family="Cormorant Garamond,Georgia,serif">${d}</text>
      </g></g>
    </g>
    ${sill}
    <rect x="${x-8}" y="${y-10}" width="${w+16}" height="${h+20}" fill="transparent"/>
  </g>`;
}

function buildScene() {
  const R = rng(7);
  let city = '', clights = '';
  const towers = [[-260,470,44],[-205,520,34],[-160,430,40],[-110,500,30],[-64,455,36],[-20,520,30],[4,488,26],[74,548,22],
                  [306,420,30],[338,470,26],[364,395,34],[402,480,30],[436,430,42],[484,505,30],[520,455,38],[566,520,34],[604,470,40]];
  towers.forEach(([x,y,w]) => {
    city += `<rect class="city" x="${x}" y="${y}" width="${w}" height="${660-y}"/>`;
    if (R() > .5) city += `<rect class="city" x="${x+w*.25}" y="${y-10}" width="${w*.5}" height="11"/>`;
    for (let yy = y + 8; yy < 640; yy += 9) for (let xx = x + 4; xx < x + w - 5; xx += 7)
      if (R() < .32) clights += `<rect x="${xx}" y="${yy}" width="3" height="2" fill="#ffd98a" fill-opacity="${(.45+R()*.55).toFixed(2)}"/>`;
  });

  // building facade details
  let rust = '';
  for (let yy = 528; yy < 690; yy += 13) rust += `M100 ${yy}H300`;
  let slates = '';
  for (let yy = 232; yy < 290; yy += 9) { const t = (yy-222)/71; slates += `M${112 - 16*t} ${yy}H${288 + 16*t}`; }

  let smallBalc = '';

  const svg = `

  <g filter="url(#paper)"><path class="mtn2" d="M-700 612Q-500 572 -320 602Q-160 562 0 598Q110 578 220 602Q360 562 520 600Q720 566 1100 606L1100 720L-700 720Z"/></g>
  <g filter="url(#paper)">${city}${taipei101(50, 660)}</g>
  <g class="clight">${clights}</g>
  <g filter="url(#paper)">
    <path class="hill" d="M-700 702Q-400 655 -120 688Q20 702 90 690L310 690Q400 680 520 700Q800 660 1100 700L1100 2200L-700 2200Z"/>
    ${pine(330,700,92,'tree2')}${pine(378,705,74,'tree2')}${pine(18,700,84,'tree2')}${pine(-30,706,70,'tree2')}${pine(430,708,80,'tree2')}
  </g>
  <g filter="url(#paper)">
    <rect class="roof" x="118" y="190" width="15" height="34"/><rect class="snowc" x="116" y="187" width="19" height="5" rx="2.5"/>
    <rect class="roof" x="266" y="194" width="15" height="30"/><rect class="snowc" x="264" y="191" width="19" height="5" rx="2.5"/>
    <path class="roof" d="M96 293L112 222L288 222L304 293Z"/>
    <path class="ln" d="${slates}" opacity=".45"/>
    <rect class="trim" x="108" y="215" width="184" height="8"/><rect class="snowc" x="106" y="211" width="188" height="5" rx="2.5"/>
    ${dormer(140)}${dormer(200)}${dormer(260)}
    <rect class="fac" x="100" y="300" width="200" height="390"/>
    <rect class="trim" x="100" y="300" width="7" height="390"/><rect class="trim" x="293" y="300" width="7" height="390"/>
    <path class="ln" d="${rust}" opacity=".35"/>
    <rect class="trim" x="92" y="290" width="216" height="12"/><path class="ln" d="M92 296H308"/>
    <rect class="snowc" x="90" y="286" width="220" height="5" rx="2.5"/>
    <rect class="trim" x="97" y="404" width="206" height="6"/><rect class="snowc" x="97" y="402" width="206" height="2.5" rx="1"/>
    <rect class="trim" x="97" y="508" width="206" height="7"/><rect class="snowc" x="97" y="506" width="206" height="2.5" rx="1"/>
    <path stroke="#26242e" stroke-width="1" d="${smallBalc}"/>
    <path stroke="#26242e" stroke-width="1" d="${balcony}"/>
    <rect fill="#26242e" x="106" y="487" width="188" height="2"/><rect fill="#26242e" x="106" y="497" width="188" height="1.5"/>

    <text x="200" y="458" text-anchor="middle" font-size="17" fill="#e8c983" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-weight="600">${PLAQUE}</text>
    <rect class="trim" x="166" y="690" width="68" height="5"/><rect class="trim" x="160" y="694" width="80" height="5"/>
    <g id="wins"></g>
  </g>
  <path class="pathc" d="M176 699L224 699Q240 770 300 870L100 870Q160 770 176 699Z"/>

    <path fill="#24283a" d="M324 602L336 602L330 595Z"/><path class="snowc" d="M324 601L336 601L330 594Z"/>
    ${pine(52,750,138,'tree')}${pine(372,752,150,'tree')}${pine(-12,760,110,'tree')}
    <path class="hill2" d="M-700 790Q-300 700 30 738Q118 748 168 800Q192 830 196 2200L-700 2200Z"/>

  const scene = document.getElementById('scene');
  scene.innerHTML = svg;
  scene.querySelector('#wins').innerHTML = Object.keys(LAYOUT).map(d => windowSVG(+d)).join('');
}
buildScene();

/* ---------- windows: state + interaction ---------- */
const wins = [...document.querySelectorAll('.win')];
function refreshWindows(instant) {
  wins.forEach(g => {
    const d = +g.dataset.d;
    if (instant) g.classList.add('instant');
    g.classList.toggle('open', opened.has(d));
    g.classList.toggle('ready', !opened.has(d) && isUnlocked(d));
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => g.classList.remove('instant')));
  });
  updateStatus();
}
let toastT;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}
wins.forEach(g => g.addEventListener('click', () => {
  const d = +g.dataset.d;
  if (opened.has(d)) return showCard(d, 0);
  if (!isUnlocked(d)) {
    g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake');
    return toast(`这扇窗 ${fmt(dayDate(d))} 才能打开哦`);
  }
  opened.add(d); saveOpened();
  g.classList.remove('ready'); g.classList.add('open');
  if (navigator.vibrate) try { navigator.vibrate(18); } catch(e) {}
  updateStatus();
  showCard(d, 1900);
}));

const modal = document.getElementById('modal');
function showCard(d, delay) {
  const c = CONTENT[d-1] || {};
  const bow = `<svg class="bowtop" width="46" height="34" viewBox="-17 -12 34 30">${bowShape()}</svg>`;
  document.getElementById('card').innerHTML = `${bow}
    <div class="meta">NO. ${d} · ${fmt(dayDate(d))}</div>
    <h2>${c.title || ''}</h2>
    ${c.img ? `<img src="${c.img}" alt="">` : ''}
    <p>${c.text || ''}</p>
    <button id="close">收下啦</button>`;
  setTimeout(() => modal.classList.add('on'), delay);
  document.getElementById('close').onclick = () => modal.classList.remove('on');
}
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('on'); });

function updateStatus() {
  const el = document.getElementById('status');
  const avail = [1,2,3,4,5,6,7,8].filter(isUnlocked);
  const waiting = avail.filter(d => !opened.has(d));
  if (!avail.length) {
    const days = Math.ceil((dayDate(1) - new Date()) / 864e5);
    el.textContent = `第一扇窗 12月25日 打开 · 还有 ${days} 天`;
  } else if (waiting.length) {
    el.textContent = waiting.length === 1 ? `第 ${waiting[0]} 扇窗可以打开了 ✦` : `有 ${waiting.length} 扇窗等你打开 ✦`;
  } else if (avail.length < 8) {
    el.textContent = `下一扇窗 · ${fmt(dayDate(avail.length + 1))} 零点`;
  } else el.textContent = 'Happy New Year ✦';
}

/* ---------- time of day ---------- */
const KF = [
  [0,    {top:'#070c24',bot:'#1b2a58',mtn:'#1a2650',city:'#121b3d',hill:'#8f9cc4',fac:'#bcc2d6',roof:'#8e95ad',tree:'#22355a',n:1}],
  [5.4,  {top:'#121840',bot:'#363b70',mtn:'#262f5c',city:'#1a2246',hill:'#97a2c6',fac:'#c2c5d6',roof:'#979ab0',tree:'#283a60',n:.92}],
  [6.5,  {top:'#3b4b8c',bot:'#f2a68a',mtn:'#6e6c96',city:'#4a4a74',hill:'#e8d6da',fac:'#f0dccc',roof:'#c6b0a8',tree:'#465878',n:.45}],
  [8,    {top:'#6aa2db',bot:'#f4dcc6',mtn:'#a9b8d2',city:'#7a8cb0',hill:'#f4f2f2',fac:'#f3ebdf',roof:'#d6ccbe',tree:'#5f8189',n:.04}],
  [12,   {top:'#4d8fd8',bot:'#c4e0f6',mtn:'#b2c5de',city:'#7f94b8',hill:'#f7f9fc',fac:'#f6efe4',roof:'#dad2c5',tree:'#5c8290',n:0}],
  [15.8, {top:'#5b8fcf',bot:'#ead6be',mtn:'#adbad2',city:'#7c8bab',hill:'#f6f3ef',fac:'#f4e9db',roof:'#d7cbba',tree:'#5e7f88',n:.04}],
  [17.2, {top:'#484e8e',bot:'#f39868',mtn:'#866e8e',city:'#5c4e72',hill:'#f2d6cc',fac:'#f3d6bc',roof:'#caa994',tree:'#4f566e',n:.42}],
  [18.2, {top:'#20255a',bot:'#a0587a',mtn:'#3c3966',city:'#29284f',hill:'#b6a8c2',fac:'#d2c4c8',roof:'#a79aa6',tree:'#2f3a5e',n:.82}],
  [19.6, {top:'#0c1335',bot:'#24326a',mtn:'#1d2852',city:'#141c40',hill:'#93a0c6',fac:'#bfc4d8',roof:'#9097b0',tree:'#24365a',n:1}],
  [24,   null],
];
KF[KF.length-1][1] = KF[0][1];
const hx = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
const mix = (a,b,t) => { const A = hx(a), B = hx(b); return '#' + A.map((v,i) => Math.round(v + (B[i]-v)*t).toString(16).padStart(2,'0')).join(''); };
function sample(h) {
  h = ((h % 24) + 24) % 24;
  let i = 0; while (i < KF.length-2 && h >= KF[i+1][0]) i++;
  const [h0,a] = KF[i], [h1,b] = KF[i+1];
  let t = (h - h0) / (h1 - h0); t = t*t*(3-2*t);
  const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' ? a[k] + (b[k]-a[k])*t : mix(a[k], b[k], t);
  return o;
}
let NIGHT = 1;
function applySky(h) {
  const c = sample(h), r = document.documentElement.style;
  NIGHT = c.n;
  const set = (k,v) => r.setProperty(k, v);
  set('--sky-top', c.top); set('--sky-bot', c.bot); set('--mtn', c.mtn); set('--mtn2', mix(c.mtn, c.city, .45));
  set('--city', c.city); set('--c101', mix(c.city, '#ffffff', .07)); set('--hill', c.hill); set('--hill2', mix(c.hill, '#ffffff', .3));
  set('--pathc', mix(c.hill, c.city, .22)); set('--facade', c.fac); set('--roof', c.roof); set('--trim', mix(c.fac, c.roof, .3));
  set('--line', mix(c.roof, '#2e2a3a', .4)); set('--shutter', mix(c.fac, '#ffffff', .12)); set('--snow', mix('#ffffff', '#cdd4ec', c.n));
  set('--tree', c.tree); set('--tree2', mix(c.tree, c.hill, .3)); set('--cloud', mix(mix('#ffffff', c.bot, .18), '#2c3766', c.n));
  set('--n', c.n.toFixed(3));
  document.querySelector('meta[name=theme-color]').content = c.top;
  document.querySelectorAll('.cloud').forEach(e => e.style.opacity = (.95 - c.n*.6).toFixed(2));

  const sun = document.getElementById('sun'), moon = document.getElementById('moon');
  const SR = 6.3, SS = 17.6;
  const arc = (t, el) => { el.style.left = (6 + 88*t) + '%'; el.style.top = (36 - 21*Math.sin(Math.PI*t)) + '%'; };
  const hh = ((h % 24) + 24) % 24;
  if (hh > SR && hh < SS) { arc((hh-SR)/(SS-SR), sun); sun.style.opacity = Math.min(1, Math.min(hh-SR, SS-hh) * 1.6); } else sun.style.opacity = 0;
  const mt = ((hh - (SS-.4) + 24) % 24) / (24 - (SS-SR) + .8);
  if (mt >= 0 && mt <= 1) { arc(mt, moon); moon.style.opacity = Math.min(1, Math.min(mt, 1-mt) * 9); } else moon.style.opacity = 0;
}
const nowHour = () => { const d = new Date(); return d.getHours() + d.getMinutes()/60; };
let HOUR = HOUR_OVERRIDE ?? nowHour();
applySky(HOUR);
if (HOUR_OVERRIDE == null && !PREVIEW) setInterval(() => { applySky(nowHour()); refreshWindows(false); }, 30000);

/* ---------- stars & snow ---------- */
const sc = document.getElementById('stars'), sx = sc.getContext('2d');
const nc = document.getElementById('snow'), nx = nc.getContext('2d');
let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1), stars = [], flakes = [];
function resize() {
  W = innerWidth; H = innerHeight;
  [sc, nc].forEach(c => { c.width = W*DPR; c.height = H*DPR; c.getContext('2d').setTransform(DPR,0,0,DPR,0,0); });
  const R = rng(3);
  stars = Array.from({length: Math.round(W*H/2600)}, () => ({x: R()*W, y: Math.pow(R(),1.4)*H*.72, r: R()*1.1+.3, p: R()*6.28, s: .6+R()*1.6}));
  // a soft band of tiny stars (milky way)
  for (let i = 0; i < W*H/1800; i++) { const t = R(); stars.push({x: t*W + (R()-.5)*90, y: H*.05 + t*H*.32 + (R()-.5)*70, r: R()*.6+.2, p: R()*6.28, s: .5+R()}); }
  const n = Math.round(Math.min(140, W*H/7000));
  flakes = Array.from({length: n}, () => ({x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.9+.6, v: Math.random()*.45+.25, w: Math.random()*6.28}));
}
addEventListener('resize', resize); resize();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t) {
  sx.clearRect(0,0,W,H);
  if (NIGHT > .02) {
    sx.fillStyle = '#fff';
    for (const s of stars) { sx.globalAlpha = NIGHT * (.45 + .55*Math.abs(Math.sin(s.p + t/1000*s.s*.6))); sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 6.28); sx.fill(); }
    sx.globalAlpha = 1;
  }
  nx.clearRect(0,0,W,H); nx.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of flakes) {
    f.y += f.v * (reduce ? .3 : 1); f.w += .012; f.x += Math.sin(f.w) * .3;
    if (f.y > H + 4) { f.y = -4; f.x = Math.random()*W; }
    nx.beginPath(); nx.arc(f.x, f.y, f.r, 0, 6.28); nx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- preview tools ---------- */
if (PREVIEW) {
  document.body.classList.add('has-preview');
  const p = document.getElementById('preview'), s = document.getElementById('hslider'), l = document.getElementById('hlabel');
  p.classList.add('on'); s.value = HOUR;
  const lab = h => { const m = Math.round(h*60) % 1440; l.textContent = String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
  lab(HOUR);
  s.oninput = () => { applySky(+s.value); lab(+s.value); };
  document.getElementById('reset').onclick = () => { opened.clear(); saveOpened(); refreshWindows(false); };
}
refreshWindows(true);
</script>
