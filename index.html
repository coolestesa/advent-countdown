<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Winter Windows</title>
<meta name="theme-color" content="#070b1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--n:1;--day:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#070b1c}
body{font-family:'Cormorant Garamond','Noto Serif TC',Georgia,serif;color:#fff;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#sky,#scene,#fg,#snow,#grain,#vig{position:fixed;inset:0;width:100%;height:100%}
#sky{z-index:1}
#scene{z-index:3;height:100dvh}
#fg{z-index:4;pointer-events:none;filter:blur(3.5px);height:100dvh}
#snow{z-index:5;pointer-events:none}
#vig{z-index:6;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(5,8,25,.42) 100%)}
#grain{z-index:7;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-size:200px 200px}

#title{position:fixed;z-index:8;left:0;right:0;top:calc(env(safe-area-inset-top) + 3.6vh);text-align:center;pointer-events:none;
  text-shadow:0 1px 10px rgba(5,10,40,.5),0 0 2px rgba(5,10,40,.3)}
#title .sub{font-size:11px;letter-spacing:.46em;font-weight:600;opacity:.9;padding-left:.46em}
#title h1{font-style:italic;font-weight:500;font-size:clamp(34px,10vw,48px);line-height:1.05;color:#f1d89b;margin-top:3px}

#status{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 3vh);
  font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:.08em;white-space:nowrap;padding:8px 18px;border-radius:999px;
  background:rgba(12,16,40,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(241,216,155,.35);color:#f8efd8}
#toast{position:fixed;z-index:10;left:50%;bottom:calc(env(safe-area-inset-bottom) + 3vh + 48px);transform:translate(-50%,10px);
  font-family:'Noto Serif TC',serif;font-size:13px;padding:8px 14px;border-radius:6px;background:#fbf6ea;color:#3a2e22;
  box-shadow:0 6px 18px rgba(0,0,30,.3);opacity:0;transition:.35s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* scene classes (colors come from JS) */
.m1{fill:var(--m1)}.m2{fill:var(--m2)}.m3{fill:var(--m3)}.m4{fill:var(--m4)}
.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}
.fL{fill:var(--faceL)}.fR{fill:var(--faceR)}
.clight{opacity:var(--n)}
.dimday{opacity:calc(.18 + var(--n)*.82)}
.nightonly{opacity:var(--n)}
.dayonly{opacity:var(--day)}
.fac{fill:var(--facade)}.facD{fill:var(--facadeD)}.trim{fill:var(--trim)}
.roof{fill:var(--roof)}.roofD{fill:var(--roofD)}.roofL{fill:var(--roofL)}
.snow{fill:var(--snow)}.snowD{fill:var(--snowD)}.iron{fill:var(--iron)}.ironS{stroke:var(--iron);fill:none}
.gold{fill:var(--gold)}.ln{stroke:var(--facadeD);fill:none;stroke-width:.6}
.sline{stroke:var(--roofD);fill:none;stroke-width:.6}
.lv{stroke:var(--shutterD);stroke-width:.7;fill:none}
.shut{fill:var(--shutter);stroke:var(--shutterD);stroke-width:.6}
.shutL{fill:var(--shutterL)}
.gr1{fill:var(--green)}.gr2{fill:var(--green2)}.berry{fill:var(--berry)}
.trunk{fill:var(--trunk)}.gnd{fill:url(#gndG)}.gnd2{fill:url(#gndG2)}
.fl{fill:#ffe9b0;opacity:var(--n)}
.flg{fill:url(#flG);opacity:var(--n)}
.tw{animation:tw 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:calc(var(--n)*.25)}}

/* windows */
.win{cursor:pointer}
.halo{fill:#ffc46a;opacity:calc(var(--n)*.5)}
.win.ready .halo{opacity:calc(var(--n)*.7 + .3)}
.win.open .halo{opacity:calc(var(--n)*1 + .15)}
.sh{transform-box:fill-box;transition:transform 1.3s cubic-bezier(.55,.05,.25,1) .45s}
.sh.L{transform-origin:0% 50%}.sh.R{transform-origin:100% 50%}
.win.open .sh{transform:scaleX(-.92)}
.win.door.open .sh{transform:scaleX(-.6)}
.shade{fill:#14110f;opacity:0;transition:opacity 1.3s .45s}
.win.open .shade{opacity:.28}
.strip{transition:opacity .4s .05s}
.win.open .strip{opacity:0}
.bow,.tag{transform-box:fill-box;transform-origin:50% 50%;transition:transform .8s cubic-bezier(.5,0,.85,.45),opacity .6s .15s}
.win.open .bow{transform:translateY(50px) rotate(40deg);opacity:0}
.win.open .tag{transform:translateY(56px) rotate(-34deg);opacity:0}
.win.ready .bow{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.16)}}
.gift{opacity:0;transition:opacity .8s 1.2s}
.win.open .gift{opacity:1}
.win.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.instant *{transition:none!important}

/* card */
#modal{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(8,12,34,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s}
#modal.on{opacity:1;pointer-events:auto}
.card{position:relative;width:min(340px,100%);max-height:82vh;overflow:auto;background:#fbf7ee;color:#2d2620;border-radius:3px;
  padding:38px 26px 26px;text-align:center;box-shadow:0 22px 60px rgba(0,0,20,.5);transform:translateY(18px) scale(.96);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#modal.on .card{transform:none}
.card::before{content:"";position:absolute;inset:8px;border:1px solid #d9bf82;pointer-events:none}
.card .bowtop{position:absolute;top:-18px;left:50%;transform:translateX(-50%)}
.card .meta{font-size:12px;letter-spacing:.32em;color:#a3874c;font-weight:600}
.card h2{font-family:'Noto Serif TC',serif;font-weight:600;font-size:22px;margin:10px 0 12px;letter-spacing:.04em}
.card p{font-family:'Noto Serif TC',serif;font-size:15px;line-height:1.85;color:#4a3f34;white-space:pre-line}
.card img{width:100%;border-radius:2px;margin:6px 0 12px;display:block}
.card button{margin-top:20px;font-family:'Noto Serif TC',serif;font-size:14px;letter-spacing:.2em;padding:9px 26px;border:1px solid #2d2620;background:none;color:#2d2620;border-radius:999px;cursor:pointer}

#preview{position:fixed;z-index:11;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);display:none;align-items:center;gap:10px;
  font:12px -apple-system,system-ui,sans-serif;background:rgba(10,14,40,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 10px;border-radius:10px}
#preview.on{display:flex}
#preview input{flex:1;accent-color:#f1d89b}
#preview button{font:inherit;color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:6px;padding:5px 8px}
body.has-preview #title{top:calc(env(safe-area-inset-top) + 52px)}
@media (prefers-reduced-motion:reduce){.tw,.win.ready .bow{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="title"><div class="sub">DEC 25 — JAN 1</div><h1>Winter Windows</h1></div>
<svg id="scene" viewBox="0 0 400 860" preserveAspectRatio="xMidYMax meet"></svg>
<svg id="fg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMax meet"></svg>
<canvas id="snow"></canvas>
<div id="vig"></div>
<div id="grain"></div>
<div id="status"></div>
<div id="toast"></div>
<div id="preview"><span id="hlabel">--:--</span><input id="hslider" type="range" min="0" max="24" step="0.05"><button id="reset">重置</button></div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
/* =========================================================
   ✏️ 在这里改内容：每天一扇窗（第1天 = 12/25，第8天 = 1/1）
   img 可以放图片网址或同仓库里的文件名，例如 'photo1.jpg'
   ========================================================= */
const CONTENT = [
  { title: '圣诞快乐',   text: '第一扇窗。\n愿你今天被很多很多温柔包围。' },
  { title: '一杯热可可', text: '今天允许自己什么都不做，\n只是窝着。' },
  { title: '一首歌',     text: '（在这里放一首想让 TA 听的歌）' },
  { title: '一段回忆',   text: '（写一件你们一起经历过、\n想起来就会笑的事）' },
  { title: '一个小任务', text: '出门走一圈，\n拍一张今天的天空发给我。' },
  { title: '一张照片',   text: '（在这里放一张照片）' },
  { title: '跨年前夜',   text: '今年辛苦啦。\n谢谢你出现在这一年里。' },
  { title: '新年快乐',   text: '2027，\n我们也要一起。' },
];
const PLAQUE = '✦';     // 中间小牌子上的字，可以换成名字缩写
const YEAR = 2026;       // 12/25 所在的年份

/* ================= helpers ================= */
const Q = new URLSearchParams(location.search);
const PREVIEW = Q.has('preview');
const HOUR_OVERRIDE = Q.has('hour') ? parseFloat(Q.get('hour')) : null;
const dayDate = d => new Date(YEAR, 11, 24 + d);
const isUnlocked = d => PREVIEW || new Date() >= dayDate(d);
const fmt = dt => `${dt.getMonth()+1}月${dt.getDate()}日`;
const KEY = PREVIEW ? 'ww3-preview' : 'ww3-opened';
let opened = new Set();
try { opened = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch(e) {}
const saveOpened = () => { try { localStorage.setItem(KEY, JSON.stringify([...opened])); } catch(e) {} };
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hx = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
const toHex = a => '#' + a.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix = (a,b,t) => { const A = hx(a), B = hx(b); return toHex(A.map((v,i) => v + (B[i]-v)*t)); };
const mul = (a,t) => { const A = hx(a), T = hx(t); return toHex(A.map((v,i) => v*T[i]/255)); };
const rgba = (h,a) => { const A = hx(h); return `rgba(${A[0]},${A[1]},${A[2]},${a.toFixed(3)})`; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sstep = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const f1 = n => +n.toFixed(1);

/* ================= time-of-day palette ================= */
// zen/hor: sky; glow: sun glow color & strength; dark: farthest-to-nearest haze target; tint: light on the house
const KF = [
  [0,    {zen:'#04071a',hor:'#172650',glow:'#2b3c78',gi:.12,dark:'#060a1c',cl:'#46527e',cs:'#141a34',ca:.5, tint:'#5f6b96',n:1}],
  [5.3,  {zen:'#0a1030',hor:'#2c3468',glow:'#6a5a8e',gi:.28,dark:'#0d1230',cl:'#5c618c',cs:'#22284a',ca:.55,tint:'#69709a',n:.92}],
  [6.4,  {zen:'#2c4688',hor:'#f6b28a',glow:'#ff9456',gi:.95,dark:'#363a5e',cl:'#ffcaa2',cs:'#7a6890',ca:.9, tint:'#f6c4ab',n:.35}],
  [7.6,  {zen:'#4a7fc8',hor:'#f0d8c0',glow:'#ffd6a8',gi:.55,dark:'#4f6286',cl:'#fff5ea',cs:'#a8b2ca',ca:.95,tint:'#fff0e2',n:.04}],
  [12,   {zen:'#3b7bcf',hor:'#bad8f0',glow:'#fff6e2',gi:.35,dark:'#506689',cl:'#ffffff',cs:'#b3c1d8',ca:.9, tint:'#ffffff',n:0}],
  [15.9, {zen:'#477dc6',hor:'#e2d4c2',glow:'#ffdcae',gi:.5, dark:'#52628a',cl:'#fff3e2',cs:'#a9b0c6',ca:.95,tint:'#fff3e6',n:.03}],
  [17.3, {zen:'#3a4890',hor:'#f79c66',glow:'#ff7434',gi:1,  dark:'#3a3658',cl:'#ffb07a',cs:'#6a5278',ca:.95,tint:'#ffcda6',n:.35}],
  [18.2, {zen:'#181d4e',hor:'#b2586e',glow:'#d24c78',gi:.55,dark:'#1b1a38',cl:'#c66e8a',cs:'#3a2e56',ca:.8, tint:'#a593b8',n:.75}],
  [19.5, {zen:'#060a20',hor:'#1f2e5e',glow:'#34447e',gi:.18,dark:'#070b20',cl:'#3e4a76',cs:'#151b36',ca:.55,tint:'#5c6894',n:1}],
  [24, null],
];
KF[KF.length-1][1] = KF[0][1];
function sample(h) {
  h = ((h % 24) + 24) % 24;
  let i = 0; while (i < KF.length-2 && h >= KF[i+1][0]) i++;
  const [h0,a] = KF[i], [h1,b] = KF[i+1];
  let t = (h - h0) / (h1 - h0); t = t*t*(3-2*t);
  const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' ? a[k] + (b[k]-a[k])*t : mix(a[k], b[k], t);
  return o;
}
const SUNRISE = 6.35, SUNSET = 17.4;
function sunInfo(h) {
  const hh = ((h % 24) + 24) % 24;
  const s = (hh - SUNRISE) / (SUNSET - SUNRISE);            // 0..1 during day
  const ms = ((hh - (SUNSET + .3) + 24) % 24) / (24 - (SUNSET - SUNRISE) - .6); // moon 0..1 at night
  return { s, up: s > 0 && s < 1, elev: s > 0 && s < 1 ? Math.sin(Math.PI*s) : 0, ms, moonUp: ms > 0 && ms < 1 };
}

/* ================= house colours (daylight) ================= */
const BASE = {
  facade:'#efe4d1', facadeD:'#d2c2a7', trim:'#f8f1e4', roof:'#5f6f82', roofD:'#435062', roofL:'#8798ac',
  shutter:'#2d5a50', shutterD:'#1b3a33', shutterL:'#4f8174', iron:'#23242b', gold:'#cca75c',
  snow:'#fbfcff', snowD:'#c5d0e6', green:'#2b5638', green2:'#477a4e', berry:'#be2633', trunk:'#4a382e',
  pineL:'#47755f', pineD:'#1c3830', rib:'#a51e30', ribD:'#5a0c18', ribL:'#e3646f'
};

/* ================= scene ================= */
const LAYOUT = { // day: [cx, y, w, h]
  1:[265,322,34,62], 2:[265,420,34,66], 3:[135,322,34,62], 4:[270,544,34,74],
  5:[135,420,34,66], 6:[200,322,34,62], 7:[130,544,34,74], 8:[200,564,48,122],
};

function ridge(seed, x0, x1, base, amp, step, freqs) {
  const R = rng(seed), ph = freqs.map(() => R()*6.28);
  let d = `M${x0} 900L${x0} `;
  for (let x = x0; x <= x1; x += step) {
    let y = base;
    freqs.forEach(([f,a],i) => { y -= amp*a*(0.5 + 0.5*Math.sin(x*f + ph[i])); });
    d += `${x===x0?'':'L'+x+' '}${f1(y)}`;
  }
  return d + `L${x1} 900Z`;
}

function tower(x, top, w, cls, R, lights) {
  const h = 700 - top; let s = `<rect class="${cls}" x="${x}" y="${top}" width="${w}" height="${h}"/>`;
  const k = R();
  if (k < .25) s += `<rect class="${cls}" x="${f1(x+w*.2)}" y="${top-8}" width="${f1(w*.6)}" height="9"/><rect class="${cls}" x="${f1(x+w*.48)}" y="${top-26}" width="1.2" height="20"/>`;
  else if (k < .45) s += `<path class="${cls}" d="M${x} ${top}L${f1(x+w*.5)} ${f1(top-w*.55)}L${x+w} ${top}Z"/>`;
  else if (k < .6) s += `<rect class="${cls}" x="${f1(x+w*.1)}" y="${top-5}" width="${f1(w*.8)}" height="6"/><rect class="${cls}" x="${f1(x+w*.25)}" y="${top-10}" width="${f1(w*.5)}" height="6"/>`;
  s += `<rect class="fL" x="${x}" y="${top}" width="${f1(w*.3)}" height="${h}"/><rect class="fR" x="${f1(x+w*.82)}" y="${top}" width="${f1(w*.18)}" height="${h}"/>`;
  for (let yy = top + 7; yy < 660; yy += 8) for (let xx = x + 3; xx < x + w - 4; xx += 6)
    if (R() < .3) lights.push(`<rect x="${f1(xx)}" y="${yy}" width="2.6" height="1.8" fill="#ffd894" fill-opacity="${(.4+R()*.6).toFixed(2)}"/>`);
  return s;
}

function taipei101(cx, base, cls, lights) {
  let p = '', sh = '', y = base;
  p += `M${cx-21} ${y}L${cx-18} ${y-92}L${cx+18} ${y-92}L${cx+21} ${y}Z`; sh += `M${cx-21} ${y}L${cx-18} ${y-92}L${cx-7} ${y-92}L${cx-8} ${y}Z`;
  y -= 92;
  p += `M${cx-20} ${y}h40v-7h-40Z`; y -= 7;
  for (let i = 0; i < 8; i++) {
    const t = 40;
    p += `M${cx-13} ${y}L${cx-18} ${y-t}L${cx+18} ${y-t}L${cx+13} ${y}Z`;
    sh += `M${cx-13} ${y}L${cx-18} ${y-t}L${cx-7} ${y-t}L${cx-5} ${y}Z`;
    lights.push(`<rect x="${cx-17}" y="${y-t-1.6}" width="34" height="1.3" fill="#fff0c8"/>`);
    for (let r = 0; r < 4; r++) lights.push(`<rect x="${f1(cx-11.5-r*.9)}" y="${y-8-r*8}" width="${f1(23+r*1.8)}" height="1.1" fill="#ffd994" fill-opacity="${.35+.2*(r%2)}"/>`);
    y -= t; p += `M${cx-19} ${y}h38v-2.6h-38Z`; y -= 2.6;
  }
  p += `M${cx-11} ${y}L${cx-9} ${y-30}L${cx+9} ${y-30}L${cx+11} ${y}Z`; y -= 30;
  p += `M${cx-6.5} ${y}h13v-11h-13Z`; y -= 11;
  p += `M${cx-4} ${y}h8v-8h-8Z`; y -= 8;
  p += `M${cx-1.4} ${y}L${cx-.4} ${y-42}L${cx+.4} ${y-42}L${cx+1.4} ${y}Z`;
  lights.push(`<circle cx="${cx}" cy="${y-42}" r="1.7" fill="#ff6a5a"/><rect x="${cx-10}" y="${y+12}" width="20" height="1.4" fill="#fff0c8"/>`);
  // ornamental coins at the podium
  const coins = `<circle class="fR" cx="${cx}" cy="${base-60}" r="5.5"/><circle class="fL" cx="${cx}" cy="${base-60}" r="3"/>`;
  return `<path class="${cls}" d="${p}"/><path class="fL" d="${sh}"/>${coins}`;
}

function palace(x, y, w, cls) { // a classical hall with sweeping eaves, on a hill
  const c = x + w/2;
  return `<rect class="${cls}" x="${x+8}" y="${y-34}" width="${w-16}" height="40"/>
    <path class="fL" d="M${x+8} ${y-34}h${f1((w-16)*.3)}v40h-${f1((w-16)*.3)}Z"/>
    <path class="${cls}" d="M${x-10} ${y-36}Q${x+4} ${y-32} ${x+14} ${y-42}L${c-20} ${y-58}L${c+20} ${y-58}L${x+w-14} ${y-42}Q${x+w-4} ${y-32} ${x+w+10} ${y-36}L${x+w-6} ${y-30}L${x+6} ${y-30}Z"/>
    <rect class="${cls}" x="${x+20}" y="${y-70}" width="${w-40}" height="14"/>
    <path class="${cls}" d="M${x+6} ${y-68}Q${x+18} ${y-66} ${x+26} ${y-74}L${c-10} ${y-88}L${c+10} ${y-88}L${x+w-26} ${y-74}Q${x+w-18} ${y-66} ${x+w-6} ${y-68}L${x+w-18} ${y-64}L${x+18} ${y-64}Z"/>
    <rect class="${cls}" x="${c-2}" y="${y-96}" width="4" height="9"/>`;
}

function ferris(cx, cy, r, cls) {
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--${cls})" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="${r*.92}" fill="none" stroke="var(--${cls})" stroke-width=".5"/>`;
  for (let i = 0; i < 18; i++) {
    const a = i/18*6.283, x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
    s += `<line x1="${cx}" y1="${cy}" x2="${f1(x)}" y2="${f1(y)}" stroke="var(--${cls})" stroke-width=".45"/><rect class="${cls}" x="${f1(x-2.2)}" y="${f1(y-1)}" width="4.4" height="4" rx="1"/>`;
  }
  s += `<path class="${cls}" d="M${cx-1.5} ${cy}L${cx-r*.55} ${cy+r*1.45}h3L${cx} ${cy+3}L${cx+r*.55-3} ${cy+r*1.45}h3L${cx+1.5} ${cy}Z"/><circle class="${cls}" cx="${cx}" cy="${cy}" r="3"/>`;
  return s;
}

function shophouses(x0, x1, cls, R, lights) {
  let s = '';
  for (let x = x0; x < x1;) {
    const w = 26 + R()*22, fl = 3 + Math.floor(R()*4), top = 700 - 14 - fl*13;
    s += `<rect class="${cls}" x="${f1(x)}" y="${f1(top)}" width="${f1(w)}" height="${f1(700-top)}"/>`;
    s += `<rect class="fL" x="${f1(x)}" y="${f1(top)}" width="${f1(w*.12)}" height="${f1(700-top)}"/>`;
    if (R() < .6) { const tx = x + 4 + R()*(w-14); s += `<rect class="${cls}" x="${f1(tx)}" y="${f1(top-9)}" width="9" height="6" rx="2.5"/><rect class="${cls}" x="${f1(tx+1)}" y="${f1(top-3)}" width="1" height="3"/><rect class="${cls}" x="${f1(tx+7)}" y="${f1(top-3)}" width="1" height="3"/>`; }
    if (R() < .4) s += `<rect class="${cls}" x="${f1(x+w-12)}" y="${f1(top-7)}" width="10" height="7"/>`;
    if (R() < .35) s += `<rect class="${cls}" x="${f1(x+w-3)}" y="${f1(top+10)}" width="5" height="${f1(fl*7)}"/>`;
    for (let k = 0; k < fl; k++) {
      const yy = top + 8 + k*13;
      for (let xx = x + 4; xx < x + w - 6; xx += 9) {
        if (R() < .45) lights.push(`<rect x="${f1(xx)}" y="${f1(yy)}" width="5" height="4" fill="#ffcf86" fill-opacity="${(.45+R()*.55).toFixed(2)}"/>`);

  }
  return s;
}

function pine(x, b, h, R) {

  for (let i = 0; i < tiers; i++) {
    const t = i/(tiers-1), top = b - h + h*.12*i, bot = top + h*.2 + i*h*.012, hw = h*(.07 + .27*t), mh = (bot-top);
    let d = `M${x} ${f1(top)}C${f1(x-hw*.25)} ${f1(top+mh*.45)} ${f1(x-hw*.7)} ${f1(bot-mh*.2)} ${f1(x-hw)} ${f1(bot)}`;
    const n = 4 + i;
    for (let k = 1; k <= n; k++) { const xx = x - hw + 2*hw*k/n; d += `Q${f1(xx - hw/n)} ${f1(bot - 4 - R()*2)} ${f1(xx)} ${f1(bot + (k===n?0:R()*1.5))}`; }

function garland(x1, y1, x2, y2, sag, R, berries = .14) {
  const cx = (x1+x2)/2, cy = (y1+y2)/2 + sag*2, len = Math.hypot(x2-x1, y2-y1) + sag;
  const n = Math.max(6, Math.round(len / 1.9)); let s = '';
  for (let i = 0; i <= n; i++) {
    const t = i/n, x = (1-t)*(1-t)*x1 + 2*(1-t)*t*cx + t*t*x2, y = (1-t)*(1-t)*y1 + 2*(1-t)*t*cy + t*t*y2;
    for (let k = 0; k < 2; k++) s += `<ellipse class="${R()<.5?'gr1':'gr2'}" cx="${f1(x+(R()-.5)*2.4)}" cy="${f1(y+(R()-.5)*2.4)}" rx="2.3" ry="1.05" transform="rotate(${Math.round(R()*180)} ${f1(x)} ${f1(y)})"/>`;
    if (R() < berries) s += `<circle class="berry" cx="${f1(x+(R()-.5)*2.5)}" cy="${f1(y+(R()-.5)*2)}" r=".95"/>`;
  }
  return s;
}

// tileable cloud density
const TW = 512, TH = 160, DEN = new Float32Array(TW*TH);
(() => {
  const R = rng(11);
  [[5,.5],[10,.26],[20,.13],[40,.07],[80,.04]].forEach(([f,amp]) => {
    const gx = f, gy = Math.ceil(f*TH/TW) + 2, g = new Float32Array(gx*gy).map(() => R());
    for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
      const fx = x/TW*gx, fy = y/TW*gx, x0 = Math.floor(fx), y0 = Math.floor(fy);
      let tx = fx-x0, ty = fy-y0; tx = tx*tx*(3-2*tx); ty = ty*ty*(3-2*ty);
      const x1 = (x0+1)%gx, a = g[x0+y0*gx], b = g[x1+y0*gx], c = g[x0+(y0+1)*gx], d = g[x1+(y0+1)*gx];
      DEN[x+y*TW] += amp*((a*(1-tx)+b*tx)*(1-ty) + (c*(1-tx)+d*tx)*ty);
    }
  });
  for (let y = 0; y < TH; y++) { const p = Math.pow(Math.sin(Math.PI*y/TH), .7); for (let x = 0; x < TW; x++) DEN[x+y*TW] *= .62 + .5*p; }
})();
const cloudC = document.createElement('canvas'); cloudC.width = TW; cloudC.height = TH;
const cloudX = cloudC.getContext('2d'), cloudImg = cloudX.createImageData(TW, TH);
function paintClouds(st, sun) {
  const lit = hx(st.cl), sh = hx(st.cs), gl = hx(st.glow), A = cloudImg.data;
  // direction from clouds toward the light
  let lx = (sun.x - .5) * 2, ly = clamp((sun.y - .25) * 4, -1, 1);
  const L = Math.hypot(lx, ly) || 1; lx /= L; ly /= L;
  for (let y = 0; y < TH; y++) {
    const fade = sstep(0, .25, y/TH) * (1 - sstep(.72, 1, y/TH));
    for (let x = 0; x < TW; x++) {
      const i = x + y*TW, dd = DEN[i];
      const a = sstep(.42, .66, dd) * fade * st.ca;
      const j = 4*i;
      if (a < .004) { A[j+3] = 0; continue; }
      const sx2 = (x + Math.round(lx*7) + TW) % TW, sy2 = clamp(y + Math.round(ly*7), 0, TH-1);
      const occ = clamp((DEN[sx2 + sy2*TW] - dd) * 5 + .45, 0, 1);
      const edge = (1 - sstep(.42, .58, dd)) * st.gi * .7;
      for (let c = 0; c < 3; c++) A[j+c] = clamp(lit[c] + (sh[c]-lit[c])*occ + (gl[c]-lit[c])*edge*.6 + (255-lit[c])*edge*.15, 0, 255);
      A[j+3] = a * 255;
    }
  }
  cloudX.putImageData(cloudImg, 0, 0);
}

// milky way
const mw = document.createElement('canvas'), mwx = mw.getContext('2d');
let stars = [];
function buildStars() {
  const R = rng(3);
  stars = Array.from({length: Math.round(W*H/2200)}, () => ({x: R()*W, y: Math.pow(R(),1.3)*H*.62, r: R()*1.05+.25, p: R()*6.28, s: .5+R()*1.6}));
  mw.width = W; mw.height = H; mwx.clearRect(0,0,W,H);
  mwx.save(); mwx.translate(W*.5, H*.24); mwx.rotate(-.5);
  const g = mwx.createLinearGradient(0,-H*.09,0,H*.09);
  g.addColorStop(0,'rgba(150,160,220,0)'); g.addColorStop(.5,'rgba(190,195,240,.13)'); g.addColorStop(1,'rgba(150,160,220,0)');
  mwx.fillStyle = g; mwx.fillRect(-W, -H*.09, W*2, H*.18);
  mwx.fillStyle = '#fff';
  for (let i = 0; i < W*H/220; i++) { const x = (R()-.5)*W*1.8, y = (R()+R()+R()-1.5)*H*.05; mwx.globalAlpha = R()*.5; mwx.fillRect(x, y, .8, .8); }
  mwx.globalAlpha = .18; mwx.fillStyle = '#0a0d24';

  mwx.restore();
}

function drawSkyBG() {
  const st = STATE, sun = SUN;
  bg.width = W*DPR; bg.height = H*DPR; bx.setTransform(DPR,0,0,DPR,0,0);
  const horY = map.oy + 600*map.s;
  const g = bx.createLinearGradient(0, 0, 0, horY);
  g.addColorStop(0, st.zen); g.addColorStop(.5, mix(st.zen, st.hor, .38)); g.addColorStop(.82, mix(st.zen, st.hor, .78)); g.addColorStop(1, st.hor);
  bx.fillStyle = g; bx.fillRect(0, 0, W, H);
  // atmospheric glow around (or below) the sun
  const gx = sun.x*W, gy = Math.min(sun.y*H, horY);
  const rg = bx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H)*.8);
  rg.addColorStop(0, rgba(st.glow, .85*st.gi)); rg.addColorStop(.25, rgba(st.glow, .35*st.gi)); rg.addColorStop(1, rgba(st.glow, 0));
  bx.globalCompositeOperation = 'screen'; bx.fillStyle = rg; bx.fillRect(0, 0, W, H);
  // horizon haze band
  const hb = bx.createLinearGradient(0, horY - H*.18, 0, horY);
  hb.addColorStop(0, rgba(st.hor, 0)); hb.addColorStop(1, rgba(mix(st.hor, '#ffffff', .15), .5));
  bx.fillStyle = hb; bx.fillRect(0, horY - H*.18, W, H*.18);
  bx.globalCompositeOperation = 'source-over';
  // sun
  if (sun.up) {
    const sxp = sun.x*W, syp = sun.y*H, a = sstep(0, .06, Math.min(sun.s, 1-sun.s));
    const b = bx.createRadialGradient(sxp, syp, 0, sxp, syp, 90);
    b.addColorStop(0, `rgba(255,252,240,${a})`); b.addColorStop(.12, `rgba(255,246,220,${a*.95})`); b.addColorStop(.2, `rgba(255,228,170,${a*.4})`); b.addColorStop(1, 'rgba(255,220,160,0)');
    bx.fillStyle = b; bx.fillRect(sxp-90, syp-90, 180, 180);
  }
  // moon
  if (sun.moonUp) {
    const mx = sun.mx*W, my = sun.my*H, a = sstep(0, .05, Math.min(sun.ms, 1-sun.ms));
    const halo = bx.createRadialGradient(mx, my, 0, mx, my, 110);
    halo.addColorStop(0, `rgba(210,222,255,${.35*a})`); halo.addColorStop(1, 'rgba(210,222,255,0)');
    bx.fillStyle = halo; bx.fillRect(mx-110, my-110, 220, 220);
    const r = 15, md = bx.createRadialGradient(mx-4, my-4, 2, mx, my, r);
    md.addColorStop(0, `rgba(252,252,246,${a})`); md.addColorStop(1, `rgba(214,218,226,${a})`);
    bx.fillStyle = md; bx.beginPath(); bx.arc(mx, my, r, 0, 6.28); bx.fill();
    bx.fillStyle = `rgba(150,158,178,${.28*a})`;
    [[-4,-3,4.5],[5,2,3.2],[-2,6,2.6],[4,-6,2],[-7,3,1.8]].forEach(([dx,dy,rr]) => { bx.beginPath(); bx.arc(mx+dx, my+dy, rr, 0, 6.28); bx.fill(); });
  }
}

let cloudOff = 0;
function frameSky(t) {
  sx.setTransform(DPR,0,0,DPR,0,0);

/* ================= apply time ================= */
function applyTime(h) {
  const st = sample(h), si = sunInfo(h), r = document.documentElement.style, set = (k,v) => r.setProperty(k,v);
  STATE = st; NIGHT = st.n;
  const day = 1 - st.n;
  // sun & moon screen positions
  const s = clamp(si.s, -.08, 1.08);
  si.x = .06 + .88*s; si.y = .44 - .3*Math.sin(Math.PI*clamp(s,0,1)) + (si.up ? 0 : .06);
  si.mx = .9 - .8*si.ms; si.my = .4 - .26*Math.sin(Math.PI*si.ms);
  SUN = si;

  // haze layers: further = closer to horizon colour
  const hz = st.hor, dk = st.dark;
  set('--m1', mix(hz, dk, .2)); set('--m2', mix(hz, dk, .31)); set('--m3', mix(hz, dk, .42)); set('--m4', mix(hz, dk, .5));
  set('--l1', mix(hz, dk, .56)); set('--l2', mix(hz, dk, .65)); set('--l3', mix(hz, dk, .74));
  set('--fg1', mix(hz, dk, .12)); set('--fg2', mix(hz, dk, .3)); set('--fg3', mix(hz, dk, .45));
  const side = si.up ? (si.x - .5) * 2 : (si.mx - .5) * 2 * .3; // + = light from right
  const faceA = .12 * day + .04;
  set('--faceL', side < 0 ? `rgba(255,236,210,${(faceA*-side).toFixed(3)})` : `rgba(10,14,40,${(faceA*side+.05).toFixed(3)})`);
  set('--faceR', side > 0 ? `rgba(255,236,210,${(faceA*side).toFixed(3)})` : `rgba(10,14,40,${(faceA*-side+.05).toFixed(3)})`);

  // the house, lit by the current light
  for (const k in BASE) set('--' + k, mul(BASE[k], st.tint));
  set('--pineA', mul(side < 0 ? BASE.pineL : BASE.pineD, st.tint)); set('--pineB', mul(side < 0 ? BASE.pineD : BASE.pineL, st.tint));
  set('--g1', mul('#fdfdff', st.tint)); set('--g2', mul(mix('#c3cee6', st.hor, .15), st.tint));
  set('--fgc', mul('#1b2c2a', st.tint));
  set('--n', st.n.toFixed(3)); set('--day', day.toFixed(3));
  set('--rsL', (side < 0 ? .25 : .25 + .6*day*Math.abs(side)).toFixed(2));
  set('--rsR', (side > 0 ? .25 : .25 + .6*day*Math.abs(side)).toFixed(2));
  document.querySelector('meta[name=theme-color]').content = st.zen;

  // sunlit side vs shadow side of the facade & roof
  const lit = .22*day*Math.abs(side) + .04*day, dim = .2*day*Math.abs(side) + .05;
  const A = side < 0 ? ['#fff3df', lit, '#101436', dim] : ['#101436', dim, '#fff3df', lit];
  const fa = document.getElementById('flA'), fb = document.getElementById('flB');
  fa.setAttribute('stop-color', A[0]); fa.setAttribute('stop-opacity', A[1]); fb.setAttribute('stop-color', A[2]); fb.setAttribute('stop-opacity', A[3]);
  const ra = document.getElementById('rsA'), rb = document.getElementById('rsB');
  ra.setAttribute('stop-color', A[0]); ra.setAttribute('stop-opacity', A[1]*1.4); rb.setAttribute('stop-color', A[2]); rb.setAttribute('stop-opacity', A[3]*1.2);

  // cast shadows follow the sun
  const elev = si.elev, len = si.up ? 18 + 120*(1 - elev) : 0, dir = -Math.sign(side || 1);
  const bs = document.getElementById('bldSh');
  bs.setAttribute('dx', f1(dir * (2 + 9*(1-elev)) * day)); bs.setAttribute('dy', f1(3 + 2*elev));
  bs.setAttribute('flood-opacity', (.18 + .25*day).toFixed(2));
  const gs = document.getElementById('gshadow');
  if (si.up && day > .1) {
    const e = dir > 0 ? 300 : 100, L = len*dir;
    gs.setAttribute('d', `M${e} 692L${f1(e+L)} ${f1(696+len*.06)}L${f1(e+L*1.08)} ${f1(712+len*.08)}L${f1(e-dir*20)} 716L${200} 716L${200} 692Z`);
    gs.setAttribute('opacity', (.32*day*sstep(0,.12,Math.min(si.s,1-si.s))).toFixed(2));
    document.getElementById('treeShadows').innerHTML = TREES.map(([x,b,hh]) => `<ellipse cx="${f1(x + dir*hh*.35*(1-elev*.6))}" cy="${b+2}" rx="${f1(hh*.36*(1.2-elev*.5))}" ry="${f1(hh*.04)}" opacity="${(.3*day).toFixed(2)}"/>`).join('');
  } else { gs.setAttribute('opacity', 0); document.getElementById('treeShadows').innerHTML = ''; }

  // the dormer clock keeps time
  const hrs = ((h % 12) + 12) % 12, mins = (h % 1) * 60;
  const hand = (id, ang, len2) => { const e = document.getElementById(id); e.setAttribute('x2', f1(200 + Math.sin(ang)*len2)); e.setAttribute('y2', f1(258 - Math.cos(ang)*len2)); };
  hand('hrH', hrs/12*6.283, 5.2); hand('mnH', mins/60*6.283, 8);

  paintClouds(st, si);
  drawSkyBG();
}

/* ================= falling snow with depth ================= */
const sn = document.getElementById('snow'), nx = sn.getContext('2d');
let flakes = [];
function resize() {
  W = innerWidth; H = innerHeight;
  [sky, sn].forEach(c => { c.width = W*DPR; c.height = H*DPR; });
  nx.setTransform(DPR,0,0,DPR,0,0);
  const sc = document.getElementById('scene').getBoundingClientRect();
  const s = Math.min(sc.width/400, sc.height/860);
  map = { s, ox: (sc.width - 400*s)/2, oy: sc.height - 860*s };
  buildStars();
  const n = Math.round(Math.min(160, W*H/5500));
  flakes = Array.from({length: n}, () => { const z = Math.random(); return {x: Math.random()*W, y: Math.random()*H, z, w: Math.random()*6.28}; });
  if (STATE) drawSkyBG();
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t) {
  frameSky(t);
  nx.clearRect(0,0,W,H);
  for (const f of flakes) {
    const r = .5 + f.z*f.z*3.2, v = (.25 + f.z*.9) * (reduce ? .3 : 1);
    f.y += v; f.w += .01 + f.z*.01; f.x += Math.sin(f.w) * (.2 + f.z*.4);
    if (f.y > H + 10) { f.y = -10; f.x = Math.random()*W; }
    if (f.z > .93) { // close, out-of-focus flakes
      const g = nx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r*2.4);
      g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      nx.fillStyle = g; nx.beginPath(); nx.arc(f.x, f.y, r*2.4, 0, 6.28); nx.fill();
    } else { nx.fillStyle = `rgba(255,255,255,${(.45 + f.z*.45).toFixed(2)})`; nx.beginPath(); nx.arc(f.x, f.y, r, 0, 6.28); nx.fill(); }
  }
  requestAnimationFrame(frame);
}

/* film grain */
(() => { const c = document.createElement('canvas'); c.width = c.height = 200; const x = c.getContext('2d'), d = x.createImageData(200,200);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random()*255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
  x.putImageData(d,0,0); document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`; })();

/* ================= windows ================= */
const wins = [...document.querySelectorAll('.win')];
function refreshWindows(instant) {
  wins.forEach(g => {
    const d = +g.dataset.d;
    if (instant) g.classList.add('instant');
    g.classList.toggle('open', opened.has(d));
    g.classList.toggle('ready', !opened.has(d) && isUnlocked(d));
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => g.classList.remove('instant')));
  });
  updateStatus();
}
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
wins.forEach(g => g.addEventListener('click', () => {
  const d = +g.dataset.d;
  if (opened.has(d)) return showCard(d, 0);
  if (!isUnlocked(d)) { g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake'); return toast(`这扇窗 ${fmt(dayDate(d))} 才能打开哦`); }
  opened.add(d); saveOpened();
  g.classList.remove('ready'); g.classList.add('open');
  if (navigator.vibrate) try { navigator.vibrate(18); } catch(e) {}
  updateStatus(); showCard(d, 2100);
}));
const modal = document.getElementById('modal');
function showCard(d, delay) {
  const c = CONTENT[d-1] || {};
  document.getElementById('card').innerHTML = `<svg class="bowtop" width="52" height="40" viewBox="-18 -13 36 32"><defs><radialGradient id="bowG2" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#e3646f"/><stop offset=".55" stop-color="#a51e30"/><stop offset="1" stop-color="#5a0c18"/></radialGradient></defs>${bowShape().replaceAll('url(#bowG)','url(#bowG2)').replaceAll('var(--ribD)','#5a0c18').replaceAll('var(--ribL)','#e3646f').replaceAll('var(--rib)','#a51e30')}</svg>
    <div class="meta">NO. ${d} · ${fmt(dayDate(d))}</div><h2>${c.title || ''}</h2>
    ${c.img ? `<img src="${c.img}" alt="">` : ''}<p>${c.text || ''}</p><button id="close">收下啦</button>`;
  setTimeout(() => modal.classList.add('on'), delay);
  document.getElementById('close').onclick = () => modal.classList.remove('on');
}
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('on'); });
function updateStatus() {
  const el = document.getElementById('status'), avail = [1,2,3,4,5,6,7,8].filter(isUnlocked), waiting = avail.filter(d => !opened.has(d));
  if (!avail.length) el.textContent = `第一扇窗 12月25日 打开 · 还有 ${Math.ceil((dayDate(1) - new Date()) / 864e5)} 天`;
  else if (waiting.length) el.textContent = waiting.length === 1 ? `第 ${waiting[0]} 扇窗可以打开了 ✦` : `有 ${waiting.length} 扇窗等你打开 ✦`;
  else if (avail.length < 8) el.textContent = `下一扇窗 · ${fmt(dayDate(avail.length + 1))} 零点`;
  else el.textContent = 'Happy New Year ✦';
}

/* ================= start ================= */
const nowHour = () => { const d = new Date(); return d.getHours() + d.getMinutes()/60; };
let HOUR = HOUR_OVERRIDE ?? nowHour();
addEventListener('resize', () => { resize(); });
resize(); applyTime(HOUR);
requestAnimationFrame(frame);
if (HOUR_OVERRIDE == null && !PREVIEW) setInterval(() => { applyTime(nowHour()); refreshWindows(false); }, 60000);
if (PREVIEW) {
  document.body.classList.add('has-preview');
  const p = document.getElementById('preview'), s = document.getElementById('hslider'), l = document.getElementById('hlabel');
  p.classList.add('on'); s.value = HOUR;
  const lab = h => { const m = Math.round(h*60) % 1440; l.textContent = String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
  lab(HOUR);
  let pend = null;
  s.oninput = () => { lab(+s.value); if (!pend) pend = requestAnimationFrame(() => { pend = null; applyTime(+s.value); }); };
  document.getElementById('reset').onclick = () => { opened.clear(); saveOpened(); refreshWindows(false); };
}
refreshWindows(true);
</script>
